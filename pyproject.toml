[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pysence-standalone"
version = "0.1.0"
description = "Standalone, fully-customizable Discord Rich Presence -- monitors nothing unless you tell it to"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "websockets",
    "cryptography",
    "keyring",
]

[project.scripts]
pysence-standalone = "src.app:main"

[tool.setuptools]
packages = ["src", "src.core", "src.discord"]
